type Query {
  adminBooking(id: ID!): ConsultationBooking
  adminBookings(filter: AdminBookingFilter, page: Int, pageSize: Int): AdminBookingPage
  adminCollections: [Collection!]
  adminConsultationServices: [ConsultationService!]
