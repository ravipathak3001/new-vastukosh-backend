  adminNewsletterSubscribers(filter: AdminSubscriberFilterInput, page: Int, pageSize: Int): AdminSubscriberPage
  adminOrder(orderNo: String!): Order
  adminOrders(filter: AdminOrderFilter, page: Int, pageSize: Int, sort: AdminOrderSort): AdminOrderPage
  adminPages: [Page!]
  adminProduct(slug: String!): Product
  adminProducts(filter: AdminProductFilterInput, page: Int, pageSize: Int): AdminProductPage
  adminPromos: [Promo!]
  adminReturn(returnNo: String!): Return
  adminReturns(filter: AdminReturnFilter, page: Int, pageSize: Int): AdminReturnPage
  adminRoles: [AdminRole!]
  adminShippingAutomationSettings: ShippingAutomationSettings
  adminTestimonials: [Testimonial!]
  adminUser(id: ID!): User
  adminUsers(filter: AdminUserFilterInput, page: Int, pageSize: Int): AdminUserPage
  announcementBar: Announcement
  availableSlots(date: String!): [String!]
  cart(anonId: String): Cart
  collection(slug: String!): Collection
  collections: [Collection!]
  consultationServices: [ConsultationService!]
  faqs: [Faq!]
  featuredProducts(limit: Int): [Product!]
  legalDoc(slug: String!): LegalDoc
  legalDocs: [LegalDoc!]
  me: User
  myOrders: [Order!]
  myReturn(returnNo: String!): Return
  myReturns: [Return!]
  order(orderNo: String!): Order
  page(key: String!): Page

  """
  Today's panchang (or `date`'s) for a location. All args are optional; unset location falls back to the server's configured default (New Delhi).
  """
  panchang(
    """Civil date as yyyy-mm-dd. Defaults to today in `timezone`."""
    date: String

    """North positive. Default from server config."""
    latitude: Float

    """East positive. Default from server config."""
    longitude: Float

    """Drives `masa`. Default amanta."""
    monthSystem: PanchangMonthSystem

    """
    Wall-clock time of day as HH:MM or HH:MM:SS (24-hour), read in `timezone`. When set, the aṅgas, sidereal signs and `fractionElapsed` are measured at that instant instead of at sunrise, and `currentPeriods` is populated. Use for a birth time or a "right now" lookup.
    """
    time: String

    """IANA timezone id. Default Asia/Kolkata."""
    timezone: String
  ): Panchang

  """
  The full sunrise-to-next-sunrise day for a location, broken into every segment each anga occupies — for a day-chart view. All args are optional; unset location falls back to the server's configured default (New Delhi).
  """
  panchangTimeline(
    """Civil date as yyyy-mm-dd. Defaults to today in `timezone`."""
    date: String

    """North positive. Default from server config."""
    latitude: Float

    """East positive. Default from server config."""
    longitude: Float

    """Default amanta."""
    monthSystem: PanchangMonthSystem

    """IANA timezone id. Default Asia/Kolkata."""
    timezone: String
  ): PanchangTimeline
  permissionCatalog: [PermissionInfo!]
