"""
The Hindu almanac for one civil day at one place, computed by vedic-panchanga. Values are almanac-grade approximations — see the package's accuracy notes.
"""
type Panchang {
  auspiciousPeriods: [PanchangKaala!]

  """Ayanamsa used, in degrees."""
  ayanamsa: Float
  ayanamsaSystem: String

  """
  Auspicious/inauspicious windows containing `reference.instant`. Empty in sunrise mode; the "what's running now" answer when `time` is given.
  """
  currentPeriods: [PanchangKaala!]

  """Resolved civil date, yyyy-mm-dd in `timezone`."""
  date: String
  inauspiciousPeriods: [PanchangKaala!]
  karana: PanchangAnga
  location: PanchangLocation

  """Lunar month per the requested monthSystem."""
  masa: LocalizedString
  masaAmanta: LocalizedString
  masaPurnimanta: LocalizedString

  """Sidereal rashi of the Moon (janma rashi of the day)."""
  moonSign: LocalizedString
  moonrise: DateTime
  moonset: DateTime
  nakshatra: PanchangAnga

  """End of the vara."""
  nextSunrise: DateTime
  paksha: LocalizedString

  """
  Which instant the aṅgas below reflect — the day's sunrise unless a `time` arg was given.
  """
  reference: PanchangReference

  """Season."""
  ritu: LocalizedString
  shakaSamvat: Int
  solarNoon: DateTime

  """Sidereal rashi of the Sun."""
  sunSign: LocalizedString
  sunrise: DateTime
  sunset: DateTime
  timezone: String
  tithi: PanchangAnga
  vara: PanchangAnga
  vikramSamvat: Int
  yoga: PanchangAnga
}

"""
One limb of the panchang (tithi, nakshatra, yoga, karana or vara) as it stands at sunrise, with the window it occupies.
"""
type PanchangAnga {
  end: DateTime

  """Fraction of this limb already elapsed at the query instant, 0–1."""
  fractionElapsed: Float

  """
  1-based position in its cycle (tithi 1–30, nakshatra/yoga 1–27, karana 1–11, vara 1–7).
  """
  index: Int

  """Vimshottari lord of the nakshatra; null for other limbs."""
  lord: String
  name: LocalizedString

  """Nakshatra quarter 1–4; null for other limbs."""
  pada: Int
  start: DateTime
}

"""A named window of the day — a muhurta or a kaala."""
type PanchangKaala {
  end: DateTime
  name: LocalizedString

  """"auspicious" | "inauspicious"."""
  quality: String
  start: DateTime
}

type PanchangLocation {
  latitude: Float
  longitude: Float
  place: String
}

enum PanchangMonthSystem {
  amanta
  purnimanta
}

"""
The instant the aṅgas, sidereal signs and `fractionElapsed` figures were evaluated at.
"""
type PanchangReference {
  instant: DateTime

  """
  "sunrise" (the almanac default) or "time" when a `time` arg was supplied.
  """
  kind: String
}

"""
One occupancy window of an anga within a day's timeline — the anga plus the span it holds.
"""
type PanchangSegment {
  end: DateTime

  """
  1-based position in its cycle (tithi 1–30, nakshatra/yoga 1–27, karana 1–11).
  """
  index: Int
  name: LocalizedString
  start: DateTime
}

"""
The full sunrise-to-next-sunrise day, broken into every segment each anga occupies — the data a day-chart view needs, as opposed to `panchang`'s single sunrise/instant snapshot.
"""
type PanchangTimeline {
  auspiciousPeriods: [PanchangKaala!]
  date: String
  inauspiciousPeriods: [PanchangKaala!]
  karanaSegments: [PanchangSegment!]
  location: PanchangLocation
  moonrise: DateTime
  moonset: DateTime
  nakshatraSegments: [PanchangSegment!]
  nextSunrise: DateTime
  sunrise: DateTime
  sunset: DateTime
  timezone: String
  tithiSegments: [PanchangSegment!]
  vara: LocalizedString
  yogaSegments: [PanchangSegment!]
}

